aid: vaulted-deep
name: Vaulted Deep
description: 'Vaulted Deep is a permanent carbon removal and organic waste disposal
  company that injects carbon-filled organic waste — biosolids, agricultural byproducts
  and manure, and pulp and paper sludge — thousands of feet underground as a slurry,
  using patented geologic slurry sequestration technology adapted from oil and gas
  practice so the carbon is trapped permanently beneath impermeable rock. Spun out
  of Advantek Waste Management Services in 2023 and co-founded by Julia Reichelstein
  and Omar Abou-Sayed, it operates the Great Plains site in Hutchinson, Kansas and
  the Terminal Island site in Los Angeles, California, serving municipal wastewater
  utilities and agricultural operators while selling durable carbon removal credits
  to corporate buyers. It publishes no public API, SDK, or developer program.'
